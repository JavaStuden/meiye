server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:/app/data/wechat-share.properties,optional:file:/app/data/cos.properties
  application:
    name: meiye-live
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/meiye;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    time-zone: Asia/Shanghai
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2050MB
meiye:
  wechat:
    app-id: ${WECHAT_APP_ID:wxb495cab07d4737c7}
    app-secret: ${WECHAT_APP_SECRET:}
    env-version: ${WECHAT_ENV_VERSION:release}
    watch-url: ${MEIYE_PUBLIC_WATCH_URL:https://voice.yourunshi.online/meiye/meiye/}
    h5-room-url: ${MEIYE_PUBLIC_H5_ROOM_URL:https://voice.yourunshi.online/meiye/share/rooms/}
  admin-username: ${MEIYE_ADMIN_USERNAME:admin}
  admin-password: ${MEIYE_ADMIN_PASSWORD:}
  live-url: ${MEIYE_LIVE_URL:}
  replay-url: ${MEIYE_REPLAY_URL:}
  pseudo-url: ${MEIYE_PSEUDO_URL:}
  cos:
    bucket: ${COS_BUCKET:meiye-live-media-1344161993}
    region: ${COS_REGION:ap-guangzhou}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    public-domain: ${COS_PUBLIC_DOMAIN:}
