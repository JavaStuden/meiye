<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('演示订单')}"></head><body><header th:replace="~{fragments :: header('admin')}"></header><div class="admin-layout"><aside th:replace="~{fragments :: sidebar('orders')}"></aside><main class="admin-main">
<div class="breadcrumb"><span>管理后台 <b>/</b> 演示订单</span><span class="admin-identity">品牌管理员</span></div><div class="page-title"><div><span class="eyebrow">DEMO ORDERS</span><h1>每一份信任，都有记录</h1><p>查看观看端提交的演示订单，验证商品与下单流程。</p></div><a class="button" th:href="@{/rooms/1}">打开观看端 ↗</a></div>
<div class="notice"><svg><use href="#i-order"/></svg><span>这里的订单只用于验证业务流程，没有付款或真实履约。订单状态不代表已支付。</span></div>
<section class="card"><div class="section-heading"><h2>订单记录</h2><span class="soft-badge" th:text="${#lists.size(orders)} + ' 笔订单'">0 笔订单</span></div><div class="toolbar"><div class="search-field"><svg><use href="#i-search"/></svg><input id="order-search" aria-label="搜索订单" placeholder="搜索订单号、商品、顾客"></div><span class="muted">按提交时间排列</span></div>
<div class="table-scroll"><table><thead><tr><th>订单号 / 提交时间</th><th>商品</th><th>顾客</th><th>数量</th><th>订单金额</th><th>状态</th></tr></thead><tbody><tr class="order-row" th:each="order : ${orders}"><td><strong th:text="${order.code}"></strong><small class="secondary date-display" th:text="${order.createdAt}"></small></td><td th:text="${order.productName}"></td><td><strong th:text="${order.buyer}"></strong><small class="secondary" th:text="${order.phone}"></small></td><td th:text="${order.quantity}"></td><td class="price" th:text="'¥' + ${#numbers.formatDecimal(order.total,1,2)}"></td><td><span class="status-badge scheduled" th:text="${order.status == 'DEMO_PENDING' ? '演示待处理（未付款）' : order.status}"></span></td></tr></tbody></table></div><div class="empty-state order-empty" th:if="${#lists.isEmpty(orders)}"><svg><use href="#i-order"/></svg><h3>还没有演示订单</h3><p>在观看端选择商品并提交后，会在这里看到记录。</p></div><p class="empty-state" id="order-filter-empty" hidden>没有找到符合条件的订单。</p></section><footer class="page-footer">个人信息仅供本应用演示。上线前请配置隐私政策与正式订单权限。</footer>
</main></div><div th:replace="~{fragments :: feedback}"></div></body></html>
