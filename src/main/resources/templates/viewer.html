<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${surface == 'pc' ? '直播间列表 - 旗慧美业' : (room != null ? room.title + ' · 美业直播' : '直播间列表 - 旗慧美业')}">直播间列表 - 旗慧美业</title>
  <link rel="stylesheet" th:href="@{/style.css(v='20261108-room-selector-contrast-v1')}" href="/style.css?v=20261108-room-selector-contrast-v1">
  <link rel="stylesheet" th:href="@{/flows.css(v='20261102-qihui-v3')}" href="/flows.css?v=20261102-qihui-v3">
  <link rel="stylesheet" th:href="@{/live-room.css(v='20261102-qihui-v3')}" href="/live-room.css?v=20261102-qihui-v3">
  <link rel="stylesheet" th:href="@{/feed-playback.css(v='20261102-qihui-v3')}" href="/feed-playback.css?v=20261102-qihui-v3">
  <link rel="stylesheet" th:href="@{/live-operations.css(v='20261108-real-playback-v1')}" href="/live-operations.css?v=20261108-real-playback-v1">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
</head>
<body>
  <header class="platform-bar">
    <div class="brand"><span class="brand-mark">播</span><b>美业直播</b><span class="workspace-name">直播工作台</span></div>
    <div class="surface-tabs" role="tablist" aria-label="体验端切换">
      <button data-surface="pc" onclick="switchSurface('pc')">PC 直播后台</button>
      <button data-surface="mini" onclick="switchSurface('mini')">小程序观看端</button>
      <button data-surface="h5" onclick="switchSurface('h5')">H5 观看端</button>
      <button data-surface="capture" onclick="switchSurface('capture')">手机录制APP</button>
    </div>
    <span class="prototype">交互原型 V2.2.9 · 业务模拟</span>
  </header>
  <div id="app"></div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div style="display:none" th:if="${room != null}" th:attr="data-room-id=${room.id},data-room-mode=${room.mode}"></div>
  <script th:src="@{/app.js(v='20261108-cos-playback-v2')}" src="/app.js?v=20261108-cos-playback-v2"></script>
  <script th:src="@{/flows.js(v='20261108-comments-robots-v2')}" src="/flows.js?v=20261108-comments-robots-v2"></script>
  <script th:src="@{/live-room.js(v='20261102-qihui-v3')}" src="/live-room.js?v=20261102-qihui-v3"></script>
  <script th:src="@{/live-operations.js(v='20261109-admin-login-v1')}" src="/live-operations.js?v=20261109-admin-login-v1"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    if (typeof window !== 'undefined' && typeof db !== 'undefined') {
      var modelSurface = /*[[${surface}]]*/ null;
      var modelRoomId = /*[[${room != null ? room.id : 1}]]*/ 1;
      var route = new URLSearchParams(location.search);
      var view = route.get('view') || modelSurface || 'mini';
      var rm = Number(route.get('room')) || modelRoomId || 1;
      if (view === 'mini' || view === 'h5') {
        surface = view;
        miniPage = 'watch';
        miniTab = 'live';
        roomId = rm;
      } else if (view === 'capture') {
        surface = 'capture';
      } else if (view === 'pc') {
        surface = 'pc';
        page = route.get('page') || 'live';
      }
      if (typeof render === 'function') render();
    }
    /*]]>*/
  </script>
</body>
</html>
