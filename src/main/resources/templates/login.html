<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('管理员登录')}"></head><body><header th:replace="~{fragments :: header('admin')}"></header><main class="login-layout"><section class="login-editorial"><span class="eyebrow">BEAUTY, CONNECTED.</span><h1>把专业<br>带进每一场直播<span>。</span></h1><p>直播 · 录播 · 商品 · 互动<br>美业内容与经营，在此相连。</p><div class="login-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-bottle"></span><span class="login-play">▷</span></div><small>美业直播 / 品牌运营工作空间</small></section><section class="login-panel"><div class="login-card"><span class="brand-mark">播</span><h2>欢迎回到工作台</h2><p class="muted">登录管理场次、媒体与演示订单</p><div class="notice error" th:if="${param.error}" role="alert">用户名或密码不正确，请重试。</div><div class="notice success" th:if="${param.logout}">已安全退出。</div><form th:action="@{/login}" method="post"><div class="field"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="请输入管理员账号"></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></div><button class="button primary full-width" type="submit">登录工作台 <svg><use href="#i-arrow"/></svg></button></form><p class="login-help">首次启动请使用启动日志或环境变量中配置的管理员账号和密码。</p><a class="text-link" th:href="@{/rooms/1}">先去观看直播 <span>↗</span></a></div><small class="login-footer">专业内容，值得被看见。</small></section></main><div th:replace="~{fragments :: feedback}"></div></body></html>
