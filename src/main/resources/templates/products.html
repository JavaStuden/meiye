<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('商品配置')}"></head><body>
<header th:replace="~{fragments :: header('admin')}"></header><div class="admin-layout"><aside th:replace="~{fragments :: sidebar('products')}"></aside><main class="admin-main">
<div class="breadcrumb"><span>管理后台 <b>/</b> 商品配置</span><a th:href="@{/admin}">← 返回工作台</a></div>
<div class="page-title"><div><span class="eyebrow">PRODUCTS</span><h1>为内容，配上好商品</h1><p>配置场次关联商品和演示售价。已提交订单保留当时的商品与金额。</p></div><a class="button primary" th:href="@{/admin/products} + '#product-editor'">＋ 添加商品</a></div>
<div class="notice" th:if="${success}" th:text="${success}" role="status"></div>
<section class="card"><div class="section-heading"><h2>场次商品</h2><span class="soft-badge">仅供演示，无真实库存或支付</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>商品名称</th><th>关联场次 ID</th><th>售价</th><th>划线价</th><th>操作</th></tr></thead><tbody><tr th:each="p : ${products}"><td><strong th:text="${p.name}"></strong><p class="muted" th:text="${p.description}"></p></td><td th:text="${p.roomId}"></td><td th:text="'¥' + ${p.price}"></td><td th:text="${p.originalPrice == null ? '—' : p.originalPrice}"></td><td><a class="button" th:href="@{/admin/products(edit=${p.id})}">编辑</a></td></tr></tbody></table></div></section>
<section class="card form-card" id="product-editor"><div class="section-heading"><h2 th:text="${product == null ? '添加商品' : '编辑商品'}"></h2><a th:href="@{/admin/products}" th:if="${product != null}">取消编辑</a></div>
<form th:action="@{/admin/products}" method="post"><input th:if="${product != null}" name="id" type="hidden" th:value="${product.id}"><div class="form-grid">
<div class="field"><label for="product-room">关联场次 *</label><select id="product-room" name="roomId" required><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.title}" th:selected="${product != null and product.roomId == r.id}"></option></select></div>
<div class="field"><label for="product-name">商品名称 *</label><input id="product-name" name="name" required maxlength="120" th:value="${product != null ? product.name : ''}"></div>
<div class="field"><label for="product-price">售价（元）*</label><input id="product-price" name="price" type="number" min="0.01" max="99999999.99" step="0.01" required th:value="${product != null ? product.price : ''}"></div>
<div class="field"><label for="product-original">划线价（元）</label><input id="product-original" name="originalPrice" type="number" min="0.01" max="99999999.99" step="0.01" th:value="${product != null ? product.originalPrice : ''}"></div>
<div class="field span-two"><label for="product-description">商品说明</label><textarea id="product-description" name="description" rows="3" maxlength="1000" th:text="${product != null ? product.description : ''}"></textarea></div></div><div class="form-actions"><button class="button primary" type="submit">保存商品配置</button></div></form></section>
<footer class="page-footer">商品修改会影响后续新订单；历史订单金额不变。</footer></main></div><div th:replace="~{fragments :: feedback}"></div></body></html>
